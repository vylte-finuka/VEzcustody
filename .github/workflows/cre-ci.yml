name: Chainlink CRE CI/CD Pipeline
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '>=1.2.21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: bun install

      - name: TypeScript compilation check
        run: bun run build

      - name: Run tests
        run: bun run test

      - name: Deploy Workflow to Chainlink DON
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          CRE_ACCESS_TOKEN: ${{ secrets.CRE_ACCESS_TOKEN }}
        run: |
          echo "Deployment handled by CRE CLI / Bun runtime"
