name: VEZ CRE Workflow
on: [push, workflow_dispatch]
jobs:
  build-and-simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      
      - run: npm ci
      
      # Compiler le workflow TypeScript (utilise les SDKs, pas le CLI cre)
      - run: npm run build
      
      # Simuler avec le SDK (pas besoin de cre CLI)
      - run: npm run simulate
        env:
          CRE_ACCESS_TOKEN: ${{ secrets.CRE_ACCESS_TOKEN }}
          CRE_CUSTODIAN_PRIVATE_KEY: ${{ secrets.CRE_CUSTODIAN_PRIVATE_KEY }}
      
      # Déployer via SDK (optionnel)
      # - run: node dist/workflow.js deploy
        env:
          CRE_ACCESS_TOKEN: ${{ secrets.CRE_ACCESS_TOKEN }}
          CRE_CUSTODIAN_PRIVATE_KEY: ${{ secrets.CRE_CUSTODIAN_PRIVATE_KEY }}