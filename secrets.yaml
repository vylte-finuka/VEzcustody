# Secrets for VEzcustody CRE workflow
# Copy this file to .env.local and fill in values
# NEVER commit this file to version control

# Chainlink CRE Access Token
# Get from: cre login → cre account access
CRE_ACCESS_TOKEN: "${CRE_ACCESS_TOKEN}"

# Custodian Private Key (for signing transactions on Slura)
# This key signs mint/burn/transfer operations on VEZproxy
CRE_CUSTODIAN_PRIVATE_KEY: "${CRE_CUSTODIAN_PRIVATE_KEY}"

# Oracle Private Key (for PoR updates)
ORACLE_PRIVATE_KEY: "${ORACLE_PRIVATE_KEY}"

