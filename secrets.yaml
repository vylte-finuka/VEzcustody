# Secrets for VEzcustody CRE workflow
# Copy this file to .env.local and fill in values
# NEVER commit this file to version control

# Chainlink CRE Access Token
# Get from: cre login → cre account access
CRE_ACCESS_TOKEN=your_cre_access_token_here

# Custodian Private Key (for signing transactions on Slura)
# This key signs mint/burn/transfer operations on VEZproxy
CRE_CUSTODIAN_PRIVATE_KEY=your_custodian_private_key_here

# Oracle Private Key (for PoR updates)
ORACLE_PRIVATE_KEY=your_oracle_private_key_here

# Slura Chain Configuration
SLURA_CHAIN_ID=45057
SLURA_RPC_URL=https://slu-charene.vyft-one.com

# Contract Addresses
VEZ_PROXY_ADDRESS=0xeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
RESERVE_PROOF_ADDRESS=0xeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
AGGREGATOR_ADDRESS=0xeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
