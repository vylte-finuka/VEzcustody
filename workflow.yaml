# Workflow-specific configuration for VEZ Stablecoin Orchestrator
# Settings here override project.yaml for this workflow

staging-settings:
  user-workflow:
    workflow-name: "vez-stablecoin-orchestrator-staging"
    # deployment-registry: "private" # Optional: use private registry
  workflow-artifacts:
    workflow-path: "./src/workflow.ts"
    config-path: "./config.staging.json"
    secrets-path: "./secrets.yaml"

production-settings:
  user-workflow:
    workflow-name: "vez-stablecoin-orchestrator-production"
    # deployment-registry: "onchain:ethereum-mainnet" # Explicit onchain registry
  workflow-artifacts:
    workflow-path: "./src/workflow.ts"
    config-path: "./config.production.json"
    secrets-path: "./secrets.yaml"
